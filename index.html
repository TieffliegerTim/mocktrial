<style>

async function getModel(){
 if(aiModel) return aiModel;

  try{
   const m=await import("https://www.gstatic.com/firebasejs/12.0.0/firebase-ai.js");

   if(key){store.set("w404k",key);if(location.search.includes("k="))history.replaceState(null,"",location.pathname+"?beamer");self.FIREBASE_APPCHECK_DEBUG_TOKEN=key;const ac=await import("https://www.gstatic.com/firebasejs/12.0.0/firebase-app-check.js");ac.initializeAppCheck(app,{provider:new ac.ReCaptchaV3Provider("debug-only"),isTokenAutoRefreshEnabled:true})}
   const ai=m.getAI(app,{backend:new m.GoogleAIBackend()});
   for(const name of MODELS){
    try{const md=m.getGenerativeModel(ai,{model:name,generationConfig:{responseMimeType:"application/json",temperature:.3}});
     await tmo(md.generateContent('Reply with {"ok":true}'),25000); md._n=name; aiModel=md; setAiSt("Clerk present"); return md;

   }

 })();

async function aiJSON(prompt){
 const md0=await getModel(); if(!md0) return null;
 let mods=[md0];
 try{const m=await import("https://www.gstatic.com/firebasejs/12.0.0/firebase-ai.js");const ai=m.getAI(app,{backend:new m.GoogleAIBackend()});mods=mods.concat(MODELS.filter(n=>n!==md0._n).map(n=>{const x=m.getGenerativeModel(ai,{model:n,generationConfig:{responseMimeType:"application/json",temperature:.3}});x._n=n;return x}))}catch(e){}
 for(const md of mods){
  for(let k=0;k<2;k++){
   try{const r=await tmo(md.generateContent(prompt),45000);return JSON.parse(r.response.text().trim().replace(/^```(json)?|```$/g,""))}
   catch(e){console.warn("[court] ai",md._n,e.message);if(/429|500|503|quota|exhaust|timeout|demand|overload|unavailable|internal/i.test(e.message)){await sleep(2500*(k+1));continue}break}
  }
 }
 return null;
}
async function makeDossier(c){
 const K=CASES[c],A=argsOf(c);
 const list=A.map(a=>`${a.side==="pros"?"P":"D"} [${a.id}] (+${a.n}): ${a.text.replace(/\s+/g," ")}`).join("\n")||"(no arguments were filed)";
 let j=await aiJSON(`You are the court clerk in a classroom role-play trial (university seminar on art and censorship in China). Students were randomly assigned to argue for the prosecution (P) or the defence (D); these are roles, not their opinions.
Case: ${K.title}. Artwork: ${K.work} – ${K.desc}
Charges: ${K.charges.map(x=>x[0]+": "+x[1]).join(" | ")}
Tasks:
1) For each side, merge the students' arguments into the 3 strongest distinct points. Rewrite each in max 22 words and keep the students' ideas. Only if a side filed fewer than 3 arguments, add your own point and start it with "(clerk)". Score each point 1-10 for persuasiveness in front of a neutral jury.
2) Pick the single best original argument by its id and explain why in max 15 words.
3) Say which side argued more convincingly, in max 25 words.
Reply with JSON only: {"pros":[{"t":"...","s":7}],"def":[{"t":"...","s":6}],"best":{"id":"...","why":"..."},"edge":"pros" or "def" or "even","note":"..."}
ARGUMENTS:
${list}`);
 const fb=side=>A.filter(a=>a.side===side).sort((x,y)=>y.n-x.n).slice(0,3).map(a=>({t:a.text,s:null}));
 if(!j||!Array.isArray(j.pros)||!Array.isArray(j.def)){const b=[...A].sort((x,y)=>y.n-x.n)[0];j={pros:fb("pros"),def:fb("def"),best:b?{id:b.id,why:"most upvoted by the team"}:null,edge:"even",note:"",src:"team votes (clerk absent)"}}
 else j.src="AI clerk";
 const cl=L=>(L||[]).slice(0,3).map(x=>({t:String(x.t||"").slice(0,220),s:x.s==null?null:Math.max(1,Math.min(10,Math.round(+x.s)||5))}));
 j.pros=cl(j.pros);j.def=cl(j.def);
 if(j.best&&!A.find(a=>a.id===j.best.id))j.best=null;
 if(j.best){const a=A.find(x=>x.id===j.best.id);j.best={id:a.id,why:String(j.best.why||"").slice(0,120),text:a.text,cid:a.cid,side:a.side}}
 j.edge=["pros","def","even"].includes(j.edge)?j.edge:"even";j.note=String(j.note||"").slice(0,200);
 await set(R(`dossier/${c}`),j);
}

Strongest defence points: ${(d.def||[]).map(x=>x.t).join(" | ")||"none"}

 if(j&&j.cn)j.cn.v="Guilty";
 if(!j||!j.cn||!j.ch) j={cn:{v:"Guilty",sentence:"If tried in China: several years in prison (Art. 105)",reason:"Mocking the leader and China's partnership with Russia is treated as rumour and slander endangering state power. Acquittals in such cases are practically unheard of."},ch:{v:"Not guilty",sentence:"No offence",reason:"Political satire about public figures is protected by freedom of expression (Art. 16) and freedom of art (Art. 21 of the Federal Constitution)."},src:"fallback (clerk absent)"};
 else j.src="AI judge";

}
let assigning=false;

 const cnt={pros:0,def:0,jury:0};Object.values(P).forEach(p=>p.role&&cnt[p.role]++);const tgt={pros:.3,def:.3,jury:.4};const upd={};
 ids.forEach(id=>{const r=Object.keys(tgt).sort((a,b)=>(cnt[a]+1)/tgt[a]-(cnt[b]+1)/tgt[b])[0];cnt[r]++;upd[`players/${id}/role`]=r});

}

 if(ph==="args")m+=b("plus","+30 s")+b("next","Close the files ▶",1);
 if(ph==="dossier")m+=b("next","Prosecution pleads ▶",1);
 if(ph==="plea")m+=b("plus","+30 s")+b("clear","Clear speaker")+b("next",st.sub==="pros"?(st.rnd===2?"Defence rebuts ▶":"Defence pleads ▶"):st.sub==="def"?(st.rnd===2?"Jury question ▶":"Prosecution rebuts ▶"):"Open vote ▶",1);
 if(ph==="vopen")m+=b("next","Secret ballot ▶",1);
 if(ph==="vsecret")m+=b("next","Show the votes ▶",1);
 if(ph==="verdict"){const r=+st.rev||0;m+=r===0?b("next","Judgment ▶",1):r===1?b("next","Open the sealed envelope ▶",1):b("next","Who was the informant? ▶",1)}
 if(ph==="guess")m+=b("next","Unmask ▶",1);
 if(ph==="finale")m+=b("next","Closing question ▶",1);
 return `<div class="ctrl">${m}<span class="sp"></span><span class="small">Space / → = next step</span>${b("reset","Reset session")}</div>`;
}
function bindCtrl(){$$(".cb[data-a]").forEach(x=>x.onclick=()=>act(x.dataset.a,x))}
let resetArm=0;
async function act(a,el){
 const st=S.state||{phase:"lobby",case:0},c=st.case||0,u=o=>update(R("state"),o),ph=st.phase;
 if(a==="next"){
  if(ph==="lobby"){assignInformants();set(R("sealed/0"),{t:now(),v:"Guilty"});return u({phase:"charge",case:0,rev:0,sub:null,speaker:null})}
  if(ph==="charge")return u({phase:"args",endsAt:now()+T_ARGS*1000});
  if(ph==="args")return u({phase:"dossier"});
  if(ph==="dossier")return u({phase:"plea",sub:"pros",rnd:1,speaker:null,endsAt:now()+T_PLEA*1000});
  if(ph==="plea"){const r2=st.rnd===2;if(st.sub==="pros")return u({sub:"def",speaker:null,endsAt:now()+(r2?T_REB:T_PLEA)*1000});if(st.sub==="def"&&!r2)return u({sub:"pros",rnd:2,speaker:null,endsAt:now()+T_REB*1000});if(st.sub==="def")return u({sub:"q",speaker:null,endsAt:now()+T_Q*1000});return u({phase:"vopen",sub:null,speaker:null})}
  if(ph==="vopen")return u({phase:"vsecret"});
  if(ph==="vsecret")return u({phase:"verdict",rev:false});
  if(ph==="verdict"){const r=+st.rev||0;return r>=2?u({phase:"guess"}):u({rev:r+1})}
  if(ph==="guess")return u({phase:"finale"});
  if(ph==="finale")return u({phase:"closing"});
  return;
 }
 if(a==="appeal"){set(R("sealed/1"),{t:now(),v:"Guilty"});return u({phase:"charge",case:1,rev:0,sub:null,speaker:null})}
 if(a==="plus")return u({endsAt:Math.max(st.endsAt||0,now())+30000});
 if(a==="clear")return u({speaker:null});
 if(a==="prev"){
  if(ph==="charge")return c===1?u({phase:"verdict",case:0,rev:2}):u({phase:"lobby"});
  if(ph==="plea"&&!(st.sub==="pros"&&st.rnd!==2)){const r2=st.rnd===2;const t=st.sub==="q"?{sub:"def",rnd:2}:st.sub==="def"?{sub:"pros",rnd:r2?2:1}:{sub:"def",rnd:1};return u({...t,speaker:null,endsAt:now()+(t.rnd===2?T_REB:T_PLEA)*1000})}
  if(ph==="verdict"&&+st.rev)return u({rev:(+st.rev)-1});
  if(ph==="vopen")return u({phase:"plea",sub:"q",speaker:null});
  if(ph==="guess")return u({phase:"verdict",rev:2});
  const B={args:"charge",dossier:"args",plea:"dossier",vsecret:"vopen",verdict:"vsecret",finale:"guess",closing:"finale"};
  return B[ph]&&u({phase:B[ph]});
 }
 if(a==="reset"){
  if(Date.now()-resetArm>3000){resetArm=Date.now();el.textContent="Click again to wipe everything";return}
  busyH.clear();return set(R(),{state:{phase:"lobby",case:0}});
 }
}
if(HOST) addEventListener("keydown",e=>{
 if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 const st=S.state||{};
 if(e.key===" "||e.key==="ArrowRight"){e.preventDefault();if(st.phase!=="closing")act("next")}
 if(e.key==="ArrowLeft")act("prev");
});
let autoK="";setInterval(()=>{const st=S.state||{};if(HOST&&st.phase==="plea"&&(st.sub==="pros"||st.sub==="def")&&st.endsAt&&now()-st.endsAt>1500){const k=st.sub+(st.rnd||1)+st.endsAt;if(k!==autoK){autoK=k;act("next")}}$$("[data-end]").forEach(el=>{if(HOST&&!["args","plea"].includes(st.phase))return;const left=(st.endsAt||0)-now();el.textContent=fmt(left);el.classList.toggle("low",left<15000)})},250);
onValue(R(),s=>{
 S=s.val()||{};
 if(!S.state&&HOST) set(R("state"),{phase:"lobby",case:0});
 try{HOST?renderHost():renderPhone()}catch(e){console.error("[court]",e)}
},e=>{$("#app").innerHTML=`<div class="ph"><div class="wait"><h2>Connection blocked</h2><p class="note">${esc(e.message)}</p></div></div>`});
if(HOST) getModel();
</script>
