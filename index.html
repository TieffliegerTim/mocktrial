<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140d08">
<title>Mock Trial · 模拟法庭</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;900&display=swap" rel="stylesheet">
<style>
:root{--wall:#140d08;--wood:#4a2e1b;--wood2:#6e4529;--woodd:#2c1b10;--brass:#c9a45c;--brass2:#e9d08e;--paper:#f2e9d6;--paper2:#e8dcc2;--ink:#21180f;--ox:#a3312a;--oxg:#ff7a66;--navy:#2c5288;--navg:#86b6ff;--jur:#b08d2c;--jurg:#f0d27a;--mute:#a89a86}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--wall);color:#efe5d3;font:16px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
p{margin:0}h1,h2,h3{margin:0}
.serif{font-family:"EB Garamond",Georgia,serif}
.cn{font-family:"Noto Serif SC",serif;font-weight:900}
.small{font-size:14px;color:var(--mute)}
.crest{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--brass2),var(--brass) 55%,#8c6c2c);color:#3a230f;font-family:"Noto Serif SC";font-weight:900;font-size:20px;box-shadow:0 2px 0 #0006,inset 0 -2px 0 #0003;flex:none}
.ph{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:14px;padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom));background:radial-gradient(600px 300px at 50% -10%,#3a2414,transparent 70%)}
.top{display:flex;align-items:center;gap:10px}
.top b{font-family:"EB Garamond";font-size:20px;line-height:1}
.top .sp{flex:1}
.tag{font-size:13px;padding:5px 11px;border-radius:99px;background:#2a1b10;border:1px solid #4a3220;white-space:nowrap;color:#e8dcc6}
.tag.on{background:var(--ox);border-color:var(--ox);color:#fff}
.doc{background:var(--paper);color:var(--ink);border-radius:6px;padding:20px 20px 22px;box-shadow:0 14px 34px #000a;position:relative;display:flex;flex-direction:column;gap:12px}
.doc::before{content:"";position:absolute;inset:6px;border:1px solid #c9b994;border-radius:3px;pointer-events:none}
.doc h1{font-family:"EB Garamond";font-size:34px;line-height:1.02;font-weight:800}
.doc h2{font-family:"EB Garamond";font-size:26px;line-height:1.05;font-weight:800}
.doc .lbl{font:600 12px Inter;letter-spacing:.02em;color:#7a6a52}
.doc p{font-size:16px;line-height:1.45}
.seal{position:absolute;right:16px;top:14px;width:70px;height:70px;border-radius:50%;border:3px solid #b3241c;color:#b3241c;display:grid;place-items:center;text-align:center;font-family:"Noto Serif SC";font-weight:900;font-size:15px;line-height:1.05;transform:rotate(-12deg);opacity:.85}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:#7a6a52}
.inp{width:100%;height:50px;border-radius:6px;border:1px solid #c9b994;background:#fffaf0;color:var(--ink);padding:0 14px;font-size:16px;outline:none}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.4}
.inp:focus{border-color:var(--ox);box-shadow:0 0 0 3px #a3312a22}
.btn{height:54px;border-radius:6px;background:var(--ox);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;width:100%;box-shadow:0 3px 0 #5c1712}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #5c1712}
.btn.brass{background:linear-gradient(var(--brass2),var(--brass));color:#2a1a0c;box-shadow:0 3px 0 #7a5a24}
.btn.ghost{background:#e5d8bc;color:var(--ink);box-shadow:0 3px 0 #b9a77f}
.wait{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;flex:1;justify-content:center}
.gavel{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--brass2),var(--brass) 55%,#8c6c2c);color:#3a230f;font-family:"Noto Serif SC";font-weight:900;font-size:46px;box-shadow:0 8px 24px #0009}
.wait h2{font-family:"EB Garamond";font-size:30px}
.role{border-radius:6px;padding:18px;display:flex;flex-direction:column;gap:10px;color:#fff;position:relative;overflow:hidden}
.role.pros{background:linear-gradient(160deg,#7c241f,#3d110e)}
.role.def{background:linear-gradient(160deg,#284d84,#11243f)}
.role.jury{background:linear-gradient(160deg,#7a6320,#3a2e0e)}
.role .big{display:flex;align-items:baseline;gap:12px}
.role .big .cn{font-size:30px}
.role .big b{font-family:"EB Garamond";font-size:32px;font-weight:800}
.hint{background:#ffffff1c;border-radius:5px;padding:10px 12px;font-size:14px;line-height:1.4}
.hl{font-size:12px;font-weight:600;color:#ffffffb0}
.secret{background:#0b0807;color:#f1e4cf;border:2px dashed var(--oxg);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.secret b{color:var(--oxg)}
details.rc{border-radius:6px;background:#22160d;border:1px solid #3e2a1a;padding:11px 13px}
details.rc summary{cursor:pointer;font-weight:600;font-size:14px;color:#e8dcc6}
details.rc[open] summary{margin-bottom:10px}
.arg{display:flex;gap:10px;align-items:flex-start;background:#fffaf0;border:1px solid #d9caa8;border-radius:5px;padding:10px 12px;color:var(--ink)}
.arg p{flex:1;font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.up{flex:none;min-width:58px;height:42px;border-radius:5px;border:1px solid #c9b994;background:#efe4cb;font-weight:700;color:var(--ink)}
.up.on{background:var(--ox);color:#fff;border-color:var(--ox)}
.mine{flex:none;font-size:12px;color:#7a6a52;padding-top:4px}
.speak{border-radius:6px;padding:13px 15px;font-weight:700;font-size:17px;display:flex;justify-content:space-between;gap:10px;color:#fff;background:#3a2414;border:1px solid #5a3c24}
.speak.pros{background:var(--ox)}.speak.def{background:var(--navy)}.speak.q{background:var(--jur)}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vb{height:92px;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:17px;background:#fffaf0;color:var(--ink);border:2px solid #d9caa8}
.vb .cn{font-size:26px}
.vb.g.on{background:var(--ox);border-color:var(--ox);color:#fff}
.vb.n.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dcol{display:flex;flex-direction:column;gap:8px}
.dpt{border-radius:5px;padding:10px 12px;font-size:14px;line-height:1.4;display:flex;gap:10px;color:#fff}
.dpt b{font-family:"EB Garamond";font-size:20px;flex:none;line-height:1}
.dpt.pros{background:#6e221d}.dpt.def{background:#23406b}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gb{min-height:52px;border-radius:5px;border:2px solid #d9caa8;background:#fffaf0;color:var(--ink);font-weight:600;padding:6px 10px}
.gb.on{border-color:var(--ox);background:var(--ox);color:#fff}
.note{font-size:13px;color:var(--mute)}
.doc .note{color:#7a6a52}
.bm{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:radial-gradient(1200px 600px at 50% -20%,#3b2414,transparent 70%),var(--wall)}
.hdr{display:flex;align-items:center;gap:14px;padding:16px 28px 6px}
.hdr b{font-family:"EB Garamond";font-size:24px;display:block;line-height:1}
.hdr span{font-size:13px;color:var(--mute)}
.hdr .sp{flex:1}
.hall{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;padding:10px 28px 6px;align-items:stretch}
.hall.wide{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr)}
.court{position:relative;border-radius:14px;overflow:hidden;display:grid;grid-template-rows:auto 1fr;background:#2a1a0f;box-shadow:inset 0 0 0 2px #3e2918,0 30px 60px #000a}
.wall{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:16px;align-items:end;padding:16px 18px 0;background:repeating-linear-gradient(90deg,#3a2414 0 46px,#33200f 46px 48px),#3a2414;border-bottom:8px solid #1d1209;position:relative}
.wall::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:linear-gradient(var(--brass),#7a5a24)}
.screen{align-self:center;border-radius:6px;overflow:hidden;background:#120c07;border:5px solid #1d1209;box-shadow:0 0 0 2px var(--brass),0 10px 20px #0008;height:170px;display:grid;place-items:center;color:#e9dcc6;text-align:center;padding:0}
.screen img{width:100%;height:100%;object-fit:contain;display:block;background:#0b0805}
.screen .ex{padding:10px;font-family:"EB Garamond";font-size:18px;line-height:1.15}
.screen .ex i{display:block;font-style:normal;font:600 11px Inter;color:var(--brass);margin-bottom:4px}
.bench{position:relative;background:linear-gradient(#7a4c2d,#4f311c 70%);border-top:6px solid var(--brass);border-radius:8px 8px 0 0;padding:44px 14px 16px;text-align:center;box-shadow:0 -6px 30px #0006;transition:box-shadow .5s}
.bench .emb{position:absolute;left:50%;top:-34px;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--brass2),var(--brass) 55%,#8c6c2c);color:#3a230f;font-family:"Noto Serif SC";font-weight:900;font-size:28px;box-shadow:0 6px 16px #0009}
.bench b{display:block;font-family:"EB Garamond";font-size:22px;color:#f3e6cc}
.bench .btxt{font-size:14px;color:#e6d4b2;margin-top:4px;min-height:20px}
.bench.lit{box-shadow:0 0 0 3px var(--brass2),0 0 70px 14px #e9d08e55}
.clock{justify-self:end;align-self:center;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,#f5ecd8 0 58%,#d9c9a6 59% 62%,var(--brass) 63% 72%,#6b4f1d 73%);display:grid;place-items:center;box-shadow:0 10px 24px #0009}
.clock span{font-family:"EB Garamond";font-weight:800;font-size:34px;color:#2a1a0c;font-variant-numeric:tabular-nums}
.clock span.low{color:#b3241c}
.floor{display:grid;grid-template-columns:1fr .8fr 1fr;grid-template-rows:1.3fr 1fr;grid-template-areas:"p d f" "j j g";gap:22px 20px;padding:26px 20px 70px;background:repeating-linear-gradient(115deg,#5a3a22 0 22px,#523420 22px 44px);align-content:stretch}
.tbl{grid-area:p;border-radius:8px;padding:12px 14px 14px;background:linear-gradient(#7a4c2d,#5a371f);border-top:4px solid #8e5c37;box-shadow:0 12px 0 #2c1b10,0 18px 30px #0008;transition:box-shadow .45s,transform .45s;position:relative}
.tbl.def{grid-area:f}
.tbl h3,.jury h3,.gal h3{display:flex;align-items:center;gap:8px;font-family:"EB Garamond";font-size:25px;color:#f3e6cc;margin-bottom:8px}
.tbl h3 .cn,.jury h3 .cn,.gal h3 .cn{font-size:15px;color:#e1c88f;font-weight:600}
.lamp{width:12px;height:12px;border-radius:50%;background:#3b2a17;box-shadow:inset 0 0 0 2px #6b4f1d;flex:none;transition:background .4s,box-shadow .4s}
.tbl.pros.lit{box-shadow:0 12px 0 #2c1b10,0 0 0 3px var(--oxg),0 0 80px 18px #ff7a6655;transform:translateY(-4px)}
.tbl.def.lit{box-shadow:0 12px 0 #2c1b10,0 0 0 3px var(--navg),0 0 80px 18px #86b6ff55;transform:translateY(-4px)}
.tbl.pros.lit .lamp{background:var(--oxg);box-shadow:0 0 16px 4px var(--oxg)}
.tbl.def.lit .lamp{background:var(--navg);box-shadow:0 0 16px 4px var(--navg)}
.tbl.work .lamp{animation:blink 1.6s infinite}
@keyframes blink{50%{background:var(--brass2);box-shadow:0 0 10px 2px var(--brass2)}}
.seats{display:flex;flex-wrap:wrap;gap:6px}
.seat{padding:7px 13px;border-radius:5px;background:#00000040;color:#eadcc2;font-weight:600;font-size:17px;transition:all .35s}
.seat.speak{color:#1b0c08;font-weight:700;transform:scale(1.06)}
.tbl.pros .seat.speak{background:var(--oxg);box-shadow:0 0 18px 4px #ff7a6688}
.tbl.def .seat.speak{background:var(--navg);box-shadow:0 0 18px 4px #86b6ff88}
.seat.g{background:var(--ox);color:#fff}.seat.n{background:var(--navy);color:#fff}
.seat.inf{outline:2px dashed var(--oxg);outline-offset:2px}
.filed{position:absolute;right:12px;top:12px;font:600 12px Inter;color:#f3e6cc;background:#0005;border-radius:99px;padding:3px 9px}
.dock{grid-area:d;justify-self:center;align-self:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 16px 10px;border:3px solid var(--brass);border-bottom-width:6px;border-radius:10px 10px 4px 4px;background:#2c1b1066;text-align:center}
.dock svg{width:84px;height:84px}
.dock b{font-family:"EB Garamond";font-size:22px;color:#f3e6cc;line-height:1.1}
.dock span{font-size:12px;color:#d9c49b}
.jury{grid-area:j;border-radius:8px;padding:12px 14px;background:linear-gradient(#5a3a20,#432a16);border:3px solid #8e6a2f;transition:box-shadow .45s}
.jury.lit{box-shadow:0 0 0 3px var(--jurg),0 0 80px 16px #f0d27a44}
.jury .seats{gap:8px}
.jury .seat{background:#2c1b10;border:1px solid #6b4f1d}.jury .seat.g{background:var(--ox);border-color:var(--oxg);color:#fff;box-shadow:0 0 18px 2px #ff7a6655}.jury .seat.n{background:var(--navy);border-color:var(--navg);color:#fff;box-shadow:0 0 18px 2px #86b6ff55}.doc .seal~h1{padding-right:70px}.record .seal~h1{padding-right:100px}
.gal{grid-area:g;border-radius:8px;padding:12px 14px;background:#2c1b10aa;border:1px dashed #6b4f1d}
.gal .dots{display:flex;flex-wrap:wrap;gap:5px}
.gal .dots i{width:14px;height:14px;border-radius:50% 50% 30% 30%;background:#8a7054;display:block}
.gal .names{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:#e7d6b6}
.plate{position:absolute;left:50%;bottom:16px;opacity:0;transform:translateX(-50%) translateY(240%);transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s;padding:10px 26px 12px;border-radius:6px;background:linear-gradient(var(--brass2),var(--brass));color:#2a1a0c;text-align:center;box-shadow:0 10px 30px #000a;white-space:nowrap;z-index:3}
.plate.show{opacity:1;transform:translateX(-50%) translateY(0)}
.plate small{display:block;font:600 12px Inter;color:#5a4220}
.plate b{font-family:"EB Garamond";font-size:30px;font-weight:800;line-height:1.05}
.record{background:var(--paper);color:var(--ink);border-radius:6px;padding:28px 30px;box-shadow:0 30px 60px #000c;position:relative;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.record::before{content:"";position:absolute;inset:8px;border:1px solid #c9b994;border-radius:3px;pointer-events:none}
.record .no{font:600 13px Inter;color:#7a6a52}
.record h1{font-family:"EB Garamond";font-size:42px;line-height:1;font-weight:800}
.record h2{font-family:"EB Garamond";font-size:28px;line-height:1.05;font-weight:800}
.record p{font-size:18px;line-height:1.45}
.record .seal{width:92px;height:92px;font-size:19px;right:24px;top:20px}
.chg{border-top:1px solid #d2c3a0;padding-top:10px}
.defd{display:flex;gap:16px;align-items:center;margin:4px 0 6px}.defd img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #d2c3a0;flex:none}.defd div{font-size:16px;color:#4d4232;line-height:1.35}.defd b{display:block;font-family:"EB Garamond";font-size:21px;color:#1a1a1a}
.chg b{display:block;font-family:"EB Garamond";font-size:21px}
.chg span{font-size:16px;color:#4d4232}
.qr{align-self:center;background:#fff;padding:14px;border-radius:6px;box-shadow:0 0 0 1px #c9b994}
.qr canvas,.qr img{width:min(30vh,300px)!important;height:auto!important;display:block}
.url{font:700 16px Inter;text-align:center;overflow-wrap:anywhere}
.tally{display:flex;gap:26px;flex-wrap:wrap}
.tally div{display:flex;flex-direction:column}
.num{font-family:"EB Garamond";font-weight:800;font-size:64px;line-height:.95}
.num.p{color:var(--ox)}.num.d{color:var(--navy)}.num.j{color:#8a6a1a}
.pt{border-radius:5px;padding:12px 14px;display:flex;gap:14px;align-items:flex-start;font-size:17px;line-height:1.35;color:#fff}
.pt.pros{background:#7c241f}.pt.def{background:#284d84}
.pt .sc{font-family:"EB Garamond";font-weight:800;font-size:26px;min-width:48px;line-height:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.colh{font-family:"EB Garamond";font-size:24px;font-weight:800}
.colh.p{color:var(--ox)}.colh.d{color:var(--navy)}
.clerk{font-size:17px;border-left:3px solid #b3241c;padding-left:12px;font-style:italic;font-family:"EB Garamond";font-size:20px}
.qbig{font-family:"EB Garamond";font-size:34px;line-height:1.2;font-weight:600}
.vcard{border-radius:5px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:#fffaf0;border:1px solid #d2c3a0}
.vv{font-family:"EB Garamond";font-weight:800;font-size:40px;line-height:1}
.vv.g{color:var(--ox)}.vv.n{color:var(--navy)}
.vcard p{font-size:16px}
.src{font-size:13px;color:#7a6a52}
.hammer{border-radius:5px;padding:16px 18px;background:#fffaf0;border:1px solid #d2c3a0;display:flex;flex-direction:column;gap:6px}
.hammer q{font-family:"EB Garamond";font-size:24px;line-height:1.3;font-weight:600}
.env{border-radius:5px;padding:18px 20px;background:linear-gradient(160deg,#f7e3c9,#ecd3ad);border:2px solid #b3241c;display:flex;flex-direction:column;gap:8px;box-shadow:inset 0 0 0 5px #fff6,0 10px 24px #0002;animation:unseal .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes unseal{from{transform:scale(.6) rotate(-6deg);opacity:0}}
.envl span{display:inline-block;margin-top:8px;font:600 12px Inter;color:#fff;background:#8e1b1b;border-radius:3px;padding:4px 9px;box-shadow:0 2px 0 #0006}
.cq{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:8px 0 4px}.cq>div{border-top:3px solid var(--brass);padding-top:10px;font-size:15px;line-height:1.45}.cq b{display:block;font:600 12px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--ox);margin-bottom:6px}
.loaders{display:flex;gap:8px;flex-wrap:wrap}
.lb{font:600 13px Inter;padding:8px 12px;border-radius:5px;background:#e5d8bc;color:var(--ink);cursor:pointer}
.ctrl{display:flex;gap:10px;align-items:center;padding:10px 28px 16px;flex-wrap:wrap;opacity:.35;transition:opacity .2s}
.ctrl:hover,.ctrl:focus-within{opacity:1}
.cb{height:38px;padding:0 14px;border-radius:5px;background:#2a1b10;border:1px solid #4a3220;font-weight:600;font-size:14px;color:#efe5d3}
.cb.p{background:var(--ox);border-color:var(--ox);color:#fff}
.ctrl .sp{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a1b10;border:1px solid #4a3220;padding:10px 16px;border-radius:6px;font-size:14px;z-index:9}
@media (max-width:1000px){.hall,.hall.wide{grid-template-columns:1fr}.wall{grid-template-columns:1fr 1fr}.screen{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.verdict{font-family:"EB Garamond";font-weight:800;font-size:110px;line-height:.9;color:var(--ox);letter-spacing:.02em;animation:unseal .6s cubic-bezier(.2,1.4,.4,1) both}
.fq{display:flex;flex-direction:column;gap:12px}
.fq div{border-left:4px solid var(--brass);padding:6px 0 6px 14px;font-size:19px;line-height:1.4;animation:unseal .5s both}
.fq b{display:block;font:600 12px Inter;letter-spacing:.1em;text-transform:uppercase;color:var(--ox);margin-bottom:2px}
.jury .seat.v{border-color:var(--jurg);color:#fff}
.speak.both{background:linear-gradient(90deg,var(--ox),var(--navy))}
.clock span.up{color:#5a4220}
</style>
</head>
<body>
<div id="app"><div class="ph"><div class="wait"><div class="gavel">法</div><p class="note">Connecting to the court…</p></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import {getDatabase,ref,onValue,set,update} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";

const app=initializeApp({apiKey:"AIzaSyA3GseZ9QJ0X4r2L0phJqh-NCZZI-HrHPA",authDomain:"weibo404.firebaseapp.com",databaseURL:"https://weibo404-default-rtdb.europe-west1.firebasedatabase.app",projectId:"weibo404",storageBucket:"weibo404.firebasestorage.app",messagingSenderId:"571494018319",appId:"1:571494018319:web:17df34d7025ff75d44627a"});
const db=getDatabase(app);
const ROOM="rooms/court", R=p=>ref(db,ROOM+(p?"/"+p:""));
const HOST=new URLSearchParams(location.search).has("beamer");
// Durations in seconds – change here if needed
const T_PREP=360, T_OPEN=90, T_CLOSE=60;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch{return null}},set(k,v){try{localStorage.setItem(k,v)}catch{}}};
let cid=store.get("mt_cid"); if(!cid){cid="m"+Math.random().toString(36).slice(2,10);store.set("mt_cid",cid)}
let S={}, off=0, view="";
const now=()=>Date.now()+off;
onValue(ref(db,".info/serverTimeOffset"),s=>off=s.val()||0);
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2600)};
const fmt=ms=>{ms=Math.max(0,ms);const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const fmtUp=ms=>{const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function mount(key,html,bind){ if(view===key) return false; view=key; $("#app").innerHTML=html; bind&&bind(); return true; }
const cache={};
function setH(id,html){const el=document.getElementById(id);if(!el)return;if(cache[id]===html&&el.dataset.k===view)return;cache[id]=html;el.dataset.k=view;el.innerHTML=html}

const K={title:"The People v. Badiucao",caseNo:"(2026) Mock Crim. No. 001",accused:"Badiucao",work:"“Xi nursing Putin” (2022)",
 desc:"A digital painting in the style of a Christian Madonna: Xi Jinping holds and breast-feeds Vladimir Putin like an infant.",
 charges:[["Art. 105 (2) PRC Criminal Law","Inciting subversion of state power “by spreading rumours or slanders or any other means” – up to 5 years, more if “grave”."],["Art. 293 PRC Criminal Law","Picking quarrels and provoking trouble – used against online speech since 2013."]],
 pros:["It humiliates the head of state – mocking the leader is an attack on the whole nation.","It distorts China's neutral position on the Ukraine crisis and spreads the rumour that China feeds Russia's war.","Satire is never innocent: images like this are shared to stir people up and are used by foreign forces to smear China."],
 def:["It is a picture, not an act: no violence, no call to action, nobody harmed.","It comments on public facts: during the war China became Russia's most important trading partner.","A confident state can tolerate a cartoon – punishing it proves the artist's point."],
 jury:["Who exactly was harmed by this picture?","Is it a statement of fact – or obviously satire?","Is an artist living abroad responsible for what happens inside China?"],
 reality:"In reality Badiucao lives in exile in Australia and hid his face for years. In November 2018 his first solo show in Hong Kong was cancelled one day before opening after threats from Chinese authorities; he says police visited his family in China.",
 realitySrc:"RSF (2018); Reuters (2018); The Intercept (2019)"};
const ROLES={pros:{n:"Prosecution",cn:"公诉人",m:"Get a conviction. Argue as the state would: stability, the dignity of the leader, foreign interference.",h:"Argument ideas"},
 def:{n:"Defence",cn:"辩护人",m:"Get an acquittal. Argue for the artist: satire, facts, freedom of art.",h:"Argument ideas"},
 jury:{n:"Jury",cn:"陪审员",m:"Listen to both sides and decide. At the end you vote – in secret. Nobody will see your vote.",h:"Ask yourself"}};
const FOLLOW=[];
const PHASES=["lobby","charge","prep","open","debate","close","vote","verdict","reveal","discuss"];
const me=()=>(S.players||{})[cid];
const vote=()=>{const v=Object.values(S.vote||{});const g=v.filter(x=>x===1).length;return {n:v.length,g,ng:v.length-g}};
const juryIds=()=>{const P=S.players||{};return Object.keys(P).filter(id=>P[id].role==="jury")};
// which side(s) are lit
function lit(st){if(st.phase==="open"||st.phase==="close")return [st.sub||"pros"];if(st.phase==="debate")return ["pros","def"];return []}
const partName=st=>st.phase==="open"?"Opening statement":st.phase==="close"?"Closing statement":"Open debate";

let assigning=false;
function assignRoles(){
 const P=S.players||{};const ids=Object.keys(P).filter(id=>!P[id].role).sort((a,b)=>P[a].t-P[b].t);
 if(!ids.length||assigning)return;assigning=true;
 const cnt={pros:0,def:0,jury:0};Object.values(P).forEach(p=>p.role&&cnt[p.role]++);const tgt={pros:.3,def:.3,jury:.4};const upd={};
 ids.forEach(id=>{const r=Object.keys(tgt).sort((a,b)=>(cnt[a]+1)/tgt[a]-(cnt[b]+1)/tgt[b])[0];cnt[r]++;upd[`players/${id}/role`]=r});
 update(R(),upd).finally(()=>{assigning=false});
}

// ---------------- PHONE ----------------
function roleCard(p){
 const r=ROLES[p.role];
 return `<div class="role ${p.role}"><span class="hl">Your role, drawn by lot</span><div class="big"><span class="cn">${r.cn}</span><b>${r.n}</b></div><p>${r.m}</p><span class="hl">${r.h}</span>${K[p.role].map(h=>`<div class="hint">${esc(h)}</div>`).join("")}</div>`;
}
function renderPhone(){
 const st=S.state||{phase:"lobby"},p=me(),ph=st.phase;
 if(!p) return mount("join",joinHTML(),bindJoin);
 const top=r=>`<div class="top"><div class="crest">法</div><b>Mock Trial</b><div class="sp"></div>${r||`<span class="tag">${esc(p.name)}</span>`}</div>`;
 const wait=(k,h,t)=>mount(k,`<div class="ph">${top()}<div class="wait"><div class="gavel">法</div><h2>${h}</h2><p class="note">${t}</p></div></div>`);
 if(ph==="lobby"||!p.role) return wait("lobby","Please take a seat.","Your role is drawn by lot and handed to you when the court opens.");
 const rc=`<details class="rc"><summary>My role card</summary>${roleCard(p)}</details>`;
 const timer=`<span class="tag on" data-end="1">--:--</span>`;
 if(ph==="charge") return mount("charge",`<div class="ph">${top(`<span class="tag on">${esc(ROLES[p.role].n)}</span>`)}<p class="note">${esc(K.title)} · ${esc(K.work)}</p>${roleCard(p)}<p class="note">Keep your role to yourself. You argue your role – not your own opinion.</p></div>`);
 if(ph==="prep") return mount("prep",`<div class="ph">${top(timer)}<div class="doc"><span class="lbl">PREPARATION · 准备</span><h2>${p.role==="jury"?"Get ready to judge.":"Prepare with your team."}</h2><p>${p.role==="jury"?"While the parties prepare: decide what would convince you. You will vote at the end – in secret.":"Agree on who gives the opening statement, who debates and who gives the closing statement. Pick your three strongest points."}</p></div>${roleCard(p)}</div>`);
 if(ph==="open"||ph==="debate"||ph==="close"){
  const L=lit(st),both=L.length>1,side=L[0];
  const lbl=both?"Open debate · both parties":`${partName(st)} · ${side==="pros"?"Prosecution":"Defence"}`;
  const speak=`<div class="speak ${both?"both":side}"><span>${lbl}</span>${ph==="debate"?`<span data-up="1">0:00</span>`:`<span data-end="1">--:--</span>`}</div>`;
  if(p.role==="jury") return mount("j"+ph+(st.sub||""),`<div class="ph">${top()}${speak}<div class="doc"><span class="lbl">JURY · LISTEN</span><h2>${both?"Prosecution and defence debate.":(side==="pros"?"The prosecution speaks.":"The defence speaks.")}</h2><p>Note the strongest argument of each side. You vote at the end – in secret.</p></div>${rc}</div>`);
  mount("f"+ph+(st.sub||""),`<div class="ph">${top()}${speak}<div id="floor"></div>${rc}</div>`,()=>{$("#floor").onclick=e=>{const b=e.target.closest("[data-fl]");if(!b)return;if(b.dataset.fl==="take")update(R("state"),{speaker:{cid,name:p.name,side:p.role}});else update(R("state"),{speaker:null})}});
  const sp=st.speaker,mine=L.includes(p.role);
  setH("floor",mine?(sp&&sp.cid===cid?`<div class="doc"><span class="lbl">YOU HAVE THE FLOOR</span><h2>Your name is lit up in the courtroom.</h2><button class="btn ghost" data-fl="yield">Yield the floor</button></div>`:`${sp?`<div class="doc"><span class="lbl">ON THE FLOOR</span><h2>${esc(sp.name)}</h2><p class="note">is speaking${sp.side!==p.role?" for the other side":""}.</p></div>`:""}<button class="btn brass" data-fl="take">Take the floor · 发言</button>`):`<div class="doc"><span class="lbl">LISTEN</span><p>${sp?esc(sp.name)+" has the floor.":"The other side speaks now."}</p></div>`);
  return;
 }
 if(ph==="vote"){
  if(p.role!=="jury") return wait("vw","The jury deliberates.","The jury votes in secret. Nobody will see their votes.");
  mount("vote",`<div class="ph">${top()}<div class="doc"><span class="lbl">SECRET BALLOT · JURY</span><h2>Guilty or not guilty?</h2><p>Forget the noise – decide on the arguments. Your vote is anonymous: only the total is shown.</p></div><div class="vbtns"><button class="vb g" data-v="1"><span class="cn">有罪</span>Guilty</button><button class="vb n" data-v="0"><span class="cn">无罪</span>Not guilty</button></div><p class="note">You can change your vote until the judge closes the ballot.</p></div>`,()=>$$(".vb").forEach(b=>b.onclick=()=>{set(R(`vote/${cid}`),+b.dataset.v);navigator.vibrate&&navigator.vibrate(30)}));
  const my=(S.vote||{})[cid];$$(".vb").forEach(b=>b.classList.toggle("on",+b.dataset.v===my));
  return;
 }
 if(ph==="verdict"){const v=vote();return mount("verdict"+v.n,`<div class="ph">${top()}<div class="doc"><div class="seal">判决</div><span class="lbl">JUDGMENT · 判决书</span><h1 style="color:var(--ox)">Guilty.</h1><p>The jury voted ${v.g} guilty, ${v.ng} not guilty.</p></div></div>`)}
 if(ph==="reveal") return mount("reveal",`<div class="ph">${top()}<div class="doc"><span class="lbl">SEALED INSTRUCTION · OPENED</span><h2>The verdict was written before the trial.</h2><p>Your vote did not matter. In sensitive cases, Chinese verdicts are decided outside the courtroom – and China has no jury at all.</p></div></div>`);
 if(ph==="discuss"){const n=+st.fq||0;return mount("discuss"+n,`<div class="ph">${top()}<div class="doc"><span class="lbl">FINAL DISCUSSION · 结语</span><h2>Nobody in China will ever see this picture. So what does the art of resistance actually achieve?</h2>${FOLLOW.slice(0,n).map(f=>`<p><b>${esc(f[0])}:</b> ${esc(f[1])}</p>`).join("")}</div><p class="note">Art of Resistance · Pop Culture in China · HSG. All data is deleted after the session.</p></div>`)}
}
function joinHTML(){
 const nm=store.get("mt_name")||"";
 return `<div class="ph"><div class="wait" style="gap:18px"><div class="gavel">法</div><div class="doc" style="text-align:left;width:100%"><div class="seal">模拟<br>法庭</div><span class="lbl">SUMMONS · 传票</span><h1>You are summoned to court.</h1><p>A mock trial against a real artwork. You receive a role – prosecution, defence or jury – and argue your role, not your own opinion.</p><div class="field"><label for="nm">Name for the court roll (a pseudonym is fine – it may appear on the screen)</label><input id="nm" class="inp" maxlength="16" autocomplete="off" placeholder="e.g. Citizen Wang" value="${esc(nm)}"></div><button class="btn" id="go">Enter the courtroom</button><p class="note">No real names needed. Everything is deleted after the session.</p></div></div></div>`;
}
function bindJoin(){
 const go=()=>{const n=$("#nm").value.trim().slice(0,16)||("Citizen "+Math.floor(10+Math.random()*90));store.set("mt_name",n);set(R("players/"+cid),{name:n,t:Date.now()})};
 $("#go").onclick=go;$("#nm").onkeydown=e=>{if(e.key==="Enter")go()};
}

// ---------------- BEAMER ----------------
let IMG=store.get("mt_img0")||"exhibit.jpg";
function loadImg(file){const im=new Image();im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);IMG=cv.toDataURL("image/jpeg",.82);store.set("mt_img0",IMG);view="";renderHost();toast("Exhibit loaded")};im.src=URL.createObjectURL(file)}
const joinURL=()=>location.origin+location.pathname;
const CHAIR=`<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 6h28v26H18z" fill="#5a371f" stroke="#c9a45c" stroke-width="2"/><path d="M14 32h36v6H14z" fill="#7a4c2d" stroke="#c9a45c" stroke-width="2"/><path d="M17 38v20M47 38v20M21 38v14M43 38v14" stroke="#c9a45c" stroke-width="3" stroke-linecap="round"/></svg>`;
function renderHost(){
 assignRoles();
 const st=S.state||{phase:"lobby"},P=S.players||{},ph=st.phase;
 const wide=["verdict","reveal","discuss"].includes(ph);
 const k="h-"+ph+"-"+(st.sub||"")+"-"+(+st.fq||0)+"-"+(IMG?1:0);
 mount(k,`<div class="bm"><header class="hdr"><div class="crest">法</div><div><b>模拟法庭 · Mock Trial</b><span>${ph==="lobby"?"Art of Resistance · Pop Culture in China":esc(K.caseNo)+" · "+esc(K.title)}</span></div><div class="sp"></div><span class="small">${esc(phaseLabel(st))}</span></header>
  <main class="hall ${wide?"wide":""}"><section class="court"><div class="wall"><div class="screen">${IMG&&ph!=="lobby"?`<img alt="${esc(K.work)}" src="${IMG}">`:`<div class="ex"><i>EXHIBIT A</i>${esc(K.work)}</div>`}</div><div class="bench" id="bench"><div class="emb">法</div><b>Presiding Judge</b><div class="btxt" id="btxt"></div><div class="envl" id="envl"></div></div><div class="clock"><span id="clk">–</span></div></div>
  <div class="floor"><div class="tbl pros" id="tP"></div><div class="dock">${CHAIR}<b>${esc(K.accused)}</b><span>Defendant · absent</span></div><div class="tbl def" id="tD"></div><div class="jury" id="jb"></div><div class="gal" id="gal"></div></div><div class="plate" id="plate"></div></section>
  <aside class="record" id="rec"></aside></main>${ctrl(st)}</div>`,()=>{bindCtrl();const f=$("#im0");if(f)f.onchange=e=>e.target.files[0]&&loadImg(e.target.files[0])});
 const ids=r=>Object.keys(P).filter(id=>P[id].role===r).sort((a,b)=>P[a].t-P[b].t);
 const L=lit(st),sp=st.speaker;
 const tbl=side=>`<h3><span class="lamp"></span>${side==="pros"?"Prosecution":"Defence"} <span class="cn">${ROLES[side].cn}</span></h3><div class="seats">${ph==="lobby"?`<span class="seat">seats assigned when the court opens</span>`:ids(side).map(id=>`<span class="seat ${sp&&sp.cid===id?"speak":""}">${esc(P[id].name)}</span>`).join("")||`<span class="seat">seats empty</span>`}</div>`;
 setH("tP",tbl("pros"));setH("tD",tbl("def"));
 $("#tP").classList.toggle("lit",L.includes("pros"));$("#tD").classList.toggle("lit",L.includes("def"));
 $("#tP").classList.toggle("work",ph==="prep");$("#tD").classList.toggle("work",ph==="prep");
 const V=S.vote||{};
 setH("jb",`<h3><span class="lamp"></span>Jury <span class="cn">陪审团</span></h3><div class="seats">${ph==="lobby"?`<span class="seat">seats assigned when the court opens</span>`:ids("jury").map(id=>`<span class="seat ${ph==="vote"&&V[id]!==undefined?"v":""}">${esc(P[id].name)}${ph==="vote"&&V[id]!==undefined?" ✓":""}</span>`).join("")||`<span class="seat">seats empty</span>`}</div>`);
 $("#jb").classList.toggle("lit",ph==="vote");
 const all=Object.keys(P);
 setH("gal",ph==="lobby"?`<h3>Public gallery <span class="cn">旁听席</span></h3><div class="names">${all.map(id=>`<span>${esc(P[id].name)}</span>`).join(" · ")||"<span>empty</span>"}</div>`:`<h3>Public gallery <span class="cn">旁听席</span></h3><div class="dots">${all.map(()=>"<i></i>").join("")}</div>`);
 const BT={lobby:"The court will open shortly.",charge:"The indictment is read.",prep:"Recess. The parties prepare.",open:"Opening statements.",debate:"The floor is open.",close:"Closing statements.",vote:"The jury deliberates.",verdict:"The court has ruled.",reveal:"The verdict was written before the trial.",discuss:"Court adjourned."};
 setH("btxt",esc(BT[ph]||""));
 setH("envl",ph!=="lobby"&&S.sealed?(["reveal","discuss"].includes(ph)?`<span>✉ Sealed instruction · opened</span>`:`<span>✉ 密封 Sealed instruction</span>`):"");
 $("#bench").classList.toggle("lit",["charge","verdict","reveal"].includes(ph));
 const showPlate=L.length>0;
 setH("plate",showPlate?(sp?`<small>${sp.side==="pros"?"FOR THE PROSECUTION":"FOR THE DEFENCE"}</small><b>${esc(sp.name)}</b>`:`<small>${esc(partName(st).toUpperCase())}</small><b>${L.length>1?"Both parties":L[0]==="pros"?"The Prosecution":"The Defence"}</b>`):"");
 $("#plate").classList.toggle("show",showPlate);
 setH("rec",recordHTML(st,P));
 if(ph==="lobby"&&$("#qr")&&!$("#qr").children.length){new QRCode($("#qr"),{text:joinURL(),width:512,height:512,correctLevel:QRCode.CorrectLevel.M});const f=$("#im0");if(f)f.onchange=e=>e.target.files[0]&&loadImg(e.target.files[0])}
}
function phaseLabel(st){const i=PHASES.indexOf(st.phase);return i>0?`Step ${i} of ${PHASES.length-1}`:""}
function recordHTML(st,P){
 const ph=st.phase,head=`<span class="no">${esc(K.caseNo)}</span>`;
 if(ph==="lobby"){const n={pros:0,def:0,jury:0};Object.values(P).forEach(p=>p.role&&n[p.role]++);return `<div class="seal">模拟<br>法庭</div><span class="no">SUMMONS · 传票</span><h1>All rise.<br>Scan to enter.</h1><p>You receive a role – prosecution, defence or jury – and argue your role, not your own opinion.</p><div class="qr" id="qr"></div><div class="url">${esc(joinURL().replace(/^https?:\/\//,""))}</div><p class="src">${Object.keys(P).length} in court</p><div class="loaders"><label class="lb" for="im0">${IMG?"✓ ":""}Exhibit A: load image<input id="im0" type="file" accept="image/*" hidden></label></div>`}
 if(ph==="charge") return `<div class="seal">人民<br>法院</div>${head}<span class="no">INDICTMENT · 起诉书</span><h1>${esc(K.title)}</h1><div class="defd"><img src="badiucao.jpg" alt="Badiucao"><div><b>The defendant</b>Badiucao (巴丢草), political cartoonist, born 1986 in Shanghai, lives in exile in Melbourne.</div></div><p><b>Exhibit A:</b> ${esc(K.work)}. ${esc(K.desc)}</p>${K.charges.map(x=>`<div class="chg"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join("")}<p class="src">Your role is on your phone.</p>`;
 if(ph==="prep") return `${head}<span class="no">RECESS · 准备 · ${T_PREP/60} MINUTES</span><h1>The parties prepare.</h1><p><b>Prosecution and defence:</b> agree on your speakers and your three strongest points. Argument ideas are on your phones.</p><p><b>Jury:</b> decide what would convince you. You vote at the end – in secret.</p>`;
 if(ph==="open"||ph==="close"){const s=st.sub||"pros",T=ph==="open"?T_OPEN:T_CLOSE;return `${head}<span class="no">${ph==="open"?"OPENING STATEMENT · 开庭陈述":"CLOSING STATEMENT · 最后陈述"} · ${T} SECONDS</span><h1>${s==="pros"?"The prosecution":"The defence"} has the floor.</h1><p>${ph==="open"?(s==="pros"?"Why must the artist be convicted?":"Why must the artist be acquitted?"):"Last words to the jury – sum up your strongest point."}</p>${ph==="open"&&s==="pros"?K.charges.map(x=>`<div class="chg"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join(""):""}`}
 if(ph==="debate") return `${head}<span class="no">OPEN DEBATE · 法庭辩论 · NO TIME LIMIT</span><h1>Prosecution and defence debate.</h1><p>Answer each other directly. Tap “Take the floor” on your phone so your name lights up. The presiding judge closes the debate.</p><p class="src">Jury: listen – your vote comes at the end.</p>`;
 if(ph==="vote"){const v=vote(),J=juryIds().length;return `${head}<span class="no">SECRET DELIBERATION · 合议</span><h1>The jury votes in secret.</h1><p>Only the total will be shown. No names, no single votes.</p><div class="tally"><div><span class="num j">${v.n}</span><span class="src">of ${J} ballots cast</span></div></div>`}
 if(ph==="verdict"){const v=vote();return `<div class="seal">判决</div>${head}<span class="no">JUDGMENT · 判决书</span><span class="verdict">GUILTY.</span><p><b>The jury voted ${v.g} guilty, ${v.ng} not guilty.</b> ${v.n&&v.g<=v.ng?"The jury acquitted – the court convicts anyway.":"The court convicts."}</p><div class="chg"><b>Sentence (if tried in China)</b><span>Imprisonment under Art. 105 (2) PRC Criminal Law – inciting subversion of state power, up to 5 years.</span></div>`}
 if(ph==="reveal"){const v=vote(),sd=S.sealed||{};const hm=sd.t?new Date(sd.t).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";const mins=sd.t?Math.max(1,Math.round((now()-sd.t)/60000)):null;
  return `<div class="seal">密封</div>${head}<span class="no">SEALED INSTRUCTION · 密封件 · NOW OPENED</span><div class="env"><span class="src">Instruction to the court${hm?` · sealed at ${esc(hm)} – ${mins} minutes ago, before a single argument was heard`:""}</span><span class="vv g">Verdict: Guilty.</span></div><h2>The verdict was decided before the trial began.</h2><p>${v.n?(v.g<=v.ng?`Your jury acquitted (${v.g} guilty, ${v.ng} not guilty). It did not matter.`:`Your jury voted ${v.g} to ${v.ng} for guilty – but had it acquitted, nothing would have changed.`):"Your vote would not have mattered."} In sensitive cases, decisions in China are taken outside the courtroom – by the court's adjudication committee and the Party's political-legal committee. Under 1% of criminal cases end in acquittal. And China has no jury at all: citizens sit only as “people's assessors” (人民陪审员) next to professional judges – researchers have called them “lackeys”.</p><p class="clerk">${esc(K.reality)}</p><p class="src">Dui Hua Foundation (adjudication committees) · ChinaFile (acquittals 2013–2015) · Law &amp; Society Review: “Lay Assessors as Lackeys in Chinese Courts” · ${esc(K.realitySrc)}</p>`}
 if(ph==="discuss"){const n=+st.fq||0;return `<span class="no">FINAL DISCUSSION · 结语 · EVERYONE</span><h1>Nobody in China will ever see this picture.<br>So what does the art of resistance actually achieve?</h1><div class="fq">${FOLLOW.slice(0,n).map(f=>`<div><b>${esc(f[0])}</b>${esc(f[1])}</div>`).join("")}</div><p class="src">James C. Scott (1990): Domination and the Arts of Resistance – Hidden Transcripts. Yale University Press.</p>`}
 return "";
}
function ctrl(st){
 const ph=st.phase,s=st.sub;
 const b=(a,t,p)=>`<button class="cb ${p?"p":""}" data-a="${a}">${t}</button>`;
 const N={lobby:"Open the court ▶",charge:`Start preparation (${T_PREP/60} min) ▶`,prep:"Opening statements ▶",open:s==="def"?"Open debate ▶":"Defence opening ▶",debate:"Closing statements ▶",close:s==="def"?"Jury votes ▶":"Defence closing ▶",vote:"Announce the verdict ▶",verdict:"Open the sealed envelope ▶",reveal:"Final discussion ▶",discuss:(+st.fq||0)<FOLLOW.length?"Next follow-up question ▶":""};
 let m=ph!=="lobby"?b("prev","◀ Back"):"";
 if(["prep","open","close"].includes(ph))m+=b("plus","+30 s");
 if(["open","debate","close"].includes(ph))m+=b("clear","Clear speaker");
 if(N[ph])m+=b("next",N[ph],1);
 return `<div class="ctrl">${m}<span class="sp"></span><span class="small">Space / → = next step</span>${b("reset","Reset session")}</div>`;
}
function bindCtrl(){$$(".cb[data-a]").forEach(x=>x.onclick=()=>act(x.dataset.a,x))}
let resetArm=0;
function act(a,el){
 const st=S.state||{phase:"lobby"},u=o=>update(R("state"),{speaker:null,...o}),ph=st.phase,s=st.sub;
 if(a==="next"){
  if(ph==="lobby"){set(R("sealed"),{t:now()});return u({phase:"charge",sub:null,fq:0})}
  if(ph==="charge")return u({phase:"prep",endsAt:now()+T_PREP*1000});
  if(ph==="prep")return u({phase:"open",sub:"pros",endsAt:now()+T_OPEN*1000});
  if(ph==="open")return s!=="def"?u({sub:"def",endsAt:now()+T_OPEN*1000}):u({phase:"debate",sub:null,startedAt:now()});
  if(ph==="debate")return u({phase:"close",sub:"pros",endsAt:now()+T_CLOSE*1000});
  if(ph==="close")return s!=="def"?u({sub:"def",endsAt:now()+T_CLOSE*1000}):u({phase:"vote",sub:null});
  if(ph==="vote")return u({phase:"verdict"});
  if(ph==="verdict")return u({phase:"reveal"});
  if(ph==="reveal")return u({phase:"discuss",fq:0});
  if(ph==="discuss"&&(+st.fq||0)<FOLLOW.length)return u({fq:(+st.fq||0)+1});
  return;
 }
 if(a==="prev"){
  if(ph==="discuss"&&+st.fq)return u({fq:(+st.fq)-1});
  if(ph==="open"&&s==="def")return u({sub:"pros",endsAt:now()+T_OPEN*1000});
  if(ph==="close"&&s==="def")return u({sub:"pros",endsAt:now()+T_CLOSE*1000});
  if(ph==="debate")return u({phase:"open",sub:"def",endsAt:now()+T_OPEN*1000});
  if(ph==="vote")return u({phase:"close",sub:"def",endsAt:now()+T_CLOSE*1000});
  if(ph==="close")return u({phase:"debate",sub:null,startedAt:now()});
  if(ph==="open")return u({phase:"prep",sub:null,endsAt:now()+T_PREP*1000});
  const B={charge:"lobby",prep:"charge",verdict:"vote",reveal:"verdict",discuss:"reveal"};
  return B[ph]&&u({phase:B[ph]});
 }
 if(a==="plus")return update(R("state"),{endsAt:Math.max(st.endsAt||0,now())+30000});
 if(a==="clear")return update(R("state"),{speaker:null});
 if(a==="reset"){
  if(Date.now()-resetArm>3000){resetArm=Date.now();el.textContent="Click again to wipe everything";return}
  return set(R(),{state:{phase:"lobby"}});
 }
}
if(HOST) addEventListener("keydown",e=>{
 if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key===" "||e.key==="ArrowRight"){e.preventDefault();act("next")}
 if(e.key==="ArrowLeft")act("prev");
});
// Clocks + automatic switch from prosecution to defence when a statement's time runs out
let autoK="";
setInterval(()=>{
 const st=S.state||{},ph=st.phase,timed=["prep","open","close"].includes(ph);
 if(HOST&&(ph==="open"||ph==="close")&&st.sub==="pros"&&st.endsAt&&now()-st.endsAt>1500){const k=ph+st.endsAt;if(k!==autoK){autoK=k;act("next")}}
 const left=(st.endsAt||0)-now();
 $$("[data-end]").forEach(el=>{el.textContent=fmt(left);el.classList.toggle("low",left<15000)});
 $$("[data-up]").forEach(el=>el.textContent=fmtUp(now()-(st.startedAt||now())));
 const ck=$("#clk");if(ck){if(timed){ck.textContent=fmt(left);ck.classList.toggle("low",left<15000);ck.classList.remove("up")}else if(ph==="debate"){ck.textContent=fmtUp(now()-(st.startedAt||now()));ck.classList.add("up");ck.classList.remove("low")}else{ck.textContent="–";ck.classList.remove("low","up")}}
},250);
onValue(R(),s=>{
 S=s.val()||{};
 if(!S.state&&HOST) set(R("state"),{phase:"lobby"});
 try{HOST?renderHost():renderPhone()}catch(e){console.error("[court]",e)}
},e=>{$("#app").innerHTML=`<div class="ph"><div class="wait"><h2>Connection blocked</h2><p class="note">${esc(e.message)}</p></div></div>`});
</script>
</body>
</html>
